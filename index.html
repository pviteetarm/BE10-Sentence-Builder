<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sentence Builder</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f8fb;padding:30px}.container{max-width:1100px;margin:auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 3px 12px rgba(0,0,0,.15)}.sentence-builder{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select{flex:1;min-width:250px;padding:12px}#independent{background:#dbeafe}#connector{background:#fef3c7}#dependent{background:#dcfce7}button{padding:12px 20px;background:#2563eb;color:#fff;border:none;border-radius:8px}#sentence,#feedback{margin-top:20px;padding:15px;border-radius:10px}.correct{background:#d4edda}.incorrect{background:#f8d7da}</style></head><body><div class="container"><h1>Sentence Structure Builder</h1><div class="sentence-builder"><select id="independent"><option value="">Independent Clause</option><option>The dog barked loudly</option><option>I finished my homework</option><option>We went to the park</option><option>The students cheered</option></select><select id="connector"><option value="">Conjunction</option><option data-type="coordinating">and</option><option data-type="coordinating">but</option><option data-type="coordinating">so</option><option data-type="subordinating">because</option><option data-type="subordinating">although</option><option data-type="none">No Connector</option></select><select id="dependent"><option value="">Dependent / Second Clause</option><option data-clause="independent">everyone was excited</option><option data-clause="independent">it started to rain</option><option data-clause="dependent">it was late</option><option data-clause="dependent">the bell rang</option></select><button onclick="checkSentence()">Check Sentence</button></div><div id="sentence"></div><div id="feedback"></div></div><script>function checkSentence(){const i=document.getElementById('independent'),c=document.getElementById('connector'),d=document.getElementById('dependent');const ic=i.value,co=c.value,dc=d.value;const ct=c.options[c.selectedIndex]?.dataset.type;const cl=d.options[d.selectedIndex]?.dataset.clause;let s=ic;if(!ic){feedback.className='incorrect';feedback.innerHTML='Choose an independent clause.';return;}if(co&&co!=='No Connector')s+=' '+co;if(dc)s+=' '+dc;s+='.';sentence.innerHTML=s;if(co==='No Connector'||co===''){if(!dc){feedback.className='correct';feedback.innerHTML='✅ SIMPLE SENTENCE';}else{feedback.className='incorrect';feedback.innerHTML='❌ Simple sentences contain one independent clause.';}return;}if(ct==='coordinating'&&cl==='independent'){feedback.className='correct';feedback.innerHTML='✅ COMPOUND SENTENCE';return;}if(ct==='subordinating'&&cl==='dependent'){feedback.className='correct';feedback.innerHTML='✅ COMPLEX SENTENCE';return;}feedback.className='incorrect';feedback.innerHTML='❌ Incorrect sentence structure.';}</script></body></html>
